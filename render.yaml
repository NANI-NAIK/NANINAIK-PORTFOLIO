services:
  - type: web
    name: naninaik-portfolio
    env: node
    plan: free
    buildCommand: bun install --production=false && bun run build
    startCommand: bun run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        fromSecret: GEMINI_API_KEY
      - key: PORT
        value: "3000"
    routes:
      - path: /
        destination: /
